[package]
name = "greenhouse-firmware"
version = "0.1.0"
edition = "2021"
default-run = "greenhouse-firmware"

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "greenhouse-firmware"
test = false
bench = false

[[bin]]
name = "greenhouse-stop"
path = "src/bin/stop.rs"
test = false
bench = false

[workspace]

[dependencies]
avr-device = "0.8.1"
panic-halt = "1.0.0"
ufmt = "0.2.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7c4209fb1704276a7921c3139d5cb"
features = ["arduino-uno"]

# Optimize the firmware for the Uno's 32 KiB flash, including in development.
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"

[package]
name = "greenhouse-firmware"
version = "0.1.0"
edition = "2021"
default-run = "greenhouse-firmware"

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "greenhouse-firmware"
test = false
bench = false

[[bin]]
name = "greenhouse-stop"
path = "src/bin/stop.rs"
test = false
bench = false

[workspace]

[dependencies]
avr-device = "0.8.1"
greenhouse-protocol = { path = "../protocol" }
panic-halt = "1.0.0"
ufmt = "0.2.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e0b0105b11a7c4209fb1704276a7921c3139d5cb"
features = ["arduino-uno"]

# Optimize the firmware for the Uno's 32 KiB flash, including in development.
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"

[lints.rust]
# Register access may require unsafe; each use needs a scoped expectation.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

match_bool = "allow"
single_match_else = "allow"

needless_pass_by_value = "warn"

redundant_pub_crate = "allow"

suboptimal_flops = "warn"

string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

mem_forget = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

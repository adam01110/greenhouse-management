[package]
name = "uno-blink"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uno-blink"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-uno"]

# Optimize the firmware for the Uno's 32 KiB flash, including in development.
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
